spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.jwt.secret=chm-secret-256-bit-key-for-jwt-signing
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.cors.allowed-origins=http://localhost:3000
app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:uploads/media}
app.media.base-url=${APP_MEDIA_BASE_URL:http://localhost:8080}